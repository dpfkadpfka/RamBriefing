# v로 시작하는 태그(예: v1.0.1)를 올리면 윈도우 설치 파일을 만들어 깃허브 릴리스에 올린다.
# 릴리스 노트는 docs/releases/v버전.md에 써 둔다.
name: 설치 파일 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 앱
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 구글 키 넣기 (Secrets에서)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:GOOGLE_CLIENT_ID -or -not $env:GOOGLE_CLIENT_SECRET) { Write-Error '구글 키 Secret이 없어요'; exit 1 }
          [IO.File]::WriteAllText("$PWD/creds.json", (@{ clientId = $env:GOOGLE_CLIENT_ID; clientSecret = $env:GOOGLE_CLIENT_SECRET } | ConvertTo-Json))
      - name: 설치 파일 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never
      - name: 릴리스에 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          N="../docs/releases/$V.md"; [ -f "$N" ] || { echo "RamBriefing $V" > notes.tmp; N=notes.tmp; }
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" --title "RamBriefing $V" --notes-file "$N"
          gh release upload "$V" dist/*.exe dist/*.exe.blockmap dist/latest.yml --clobber
